name: Check build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Run build.py
        run: uv run --locked build.py
      # preview.png is skipped: text renders slightly differently on Linux than on Windows.
      - name: Fail if generated files are out of date
        run: |
          changes="$(git status --porcelain -- . ':!preview.png')"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Generated files differ from the commit. Run 'uv run build.py' and commit the result."
            exit 1
          fi

  # Merges Dependabot's action updates once the build check above passes.
  automerge:
    needs: check
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
