name: Check build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run build.py
        run: uv run --locked build.py
      # preview.png is skipped: text renders slightly differently on Linux than on Windows.
      - name: Fail if generated files are out of date
        run: |
          changes="$(git status --porcelain -- . ':!preview.png')"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Generated files differ from the commit. Run 'uv run build.py' and commit the result."
            exit 1
          fi
